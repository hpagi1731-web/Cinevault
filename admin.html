<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CineVault Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="admin.js"></script></head><body><header><a class="brand" href="./">Cine<span>Vault</span></a><a href="./">Public website</a></header><main class="admin"><p class="eyebrow">CONTENT MANAGEMENT</p><h1>Movie manager</h1><p>Sign in with the authorised account. Database security is enforced by Supabase RLS.</p><section id="login"><h2>Admin sign in</h2><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form></section><section id="manager" hidden><button id="logout">Sign out</button><p id="status"></p><form id="movieForm"><input id="id" type="hidden"><input id="title" placeholder="Movie title" required><input id="year" type="number" placeholder="Year"><input id="genre" placeholder="Genre" required><input id="rating" type="number" min="0" max="10" step=".1" placeholder="Rating"><input id="poster" type="url" placeholder="Poster image URL"><textarea id="description" placeholder="Description"></textarea><button id="save">Add movie</button><button type="button" id="clear">Clear</button></form><h2>Existing movies</h2><div id="list"></div></section></main><footer>CineVault content manager</footer></body></html>
